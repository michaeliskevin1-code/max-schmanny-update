<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kevins Radio</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#p{width:100%;height:100%}</style></head>
<body><div id="p"></div>
<script>
// Radio-Vermittler für die Tablet-App: YouTube spielt hier auf github.io (echte Webadresse),
// die App steuert per postMessage. Grund: eingebettete Player in der App (https://localhost) lehnt YouTube teils ab.
var P = null, q = new URLSearchParams(location.search);
function send(o) { o.mx = 1; try { parent.postMessage(o, '*'); } catch (e) { } }
window.onYouTubeIframeAPIReady = function () {
  P = new YT.Player('p', { width: '100%', height: '100%', videoId: q.get('v') || '',
    playerVars: { playsinline: 1, controls: 1, rel: 0, modestbranding: 1, origin: location.origin },
    events: {
      onReady: function () { send({ ev: 'ready' }); },
      onStateChange: function (e) { var d = {}; try { d = P.getVideoData() || {}; } catch (x) { } var du = 0; try { du = P.getDuration() || 0; } catch (x) { } send({ ev: 'state', data: e.data, title: d.title || '', dur: du }); },
      onError: function (e) { send({ ev: 'error', data: e.data }); }
    } });
};
addEventListener('message', function (e) {
  var d = e.data || {}; if (!d.mxc || !P) return;
  try {
    if (d.mxc === 'play') P.playVideo(); else if (d.mxc === 'pause') P.pauseVideo();
    else if (d.mxc === 'vol') P.setVolume(d.v); else if (d.mxc === 'seek') P.seekTo(d.t, true); else if (d.mxc === 'load') P.loadVideoById(d.id);
  } catch (x) { }
});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
